[package]
name = "zmux-python"
version = "0.4.5"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
name = "_zmux"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.30.1", features = ["abi3-py312"] }
tokio = { version = "1.54.1", features = ["net", "rt-multi-thread", "sync", "io-util", "time"] }
bytes = "1.12.2"
zmux = "1.3.6"
zmux-shaping = { version = "1.3.6", features = ["tokio"] }
zmux-rustls = "1.3.6"
zmux-quinn = { version = "1.3.6", features = ["rustls-ring"] }
zmux-websocket = "1.3.6"
zmux-seal = "1.3.6"
zmux-http = { version = "1.3.6", features = ["websocket"] }
zmux-h3 = "1.3.6"
zmux-webtransport = "1.3.6"
http = "1.5.0"
tokio-tungstenite = { version = "0.30.0", default-features = false }
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26.6", default-features = false }
webpki-roots = "1.0.12"

[features]
# Test-only entry points of the extension (`zmux._zmux._panic`); the test
# builds enable it, the published wheels do not.
test-hooks = []

[profile.release]
lto = "thin"
codegen-units = 1


[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# PyO3 signatures take arguments by value and return `PyResult` by contract,
# and a binding module is long by nature.
needless_pass_by_value = "allow"
unnecessary_wraps = "allow"
unused_self = "allow"
too_many_lines = "allow"
too_many_arguments = "allow"
many_single_char_names = "allow"
# Pool timings and rates are floats at the Python boundary; the casts clamp.
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
