[package]
name = "zmux-python"
version = "0.3.1"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
name = "_zmux"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.30", features = ["abi3-py312"] }
pyo3-async-runtimes = { version = "0.30", features = ["tokio-runtime"] }
tokio = { version = "1.47", features = ["net", "rt-multi-thread", "sync", "io-util"] }
bytes = "1"
zmux = "1.2.4"
zmux-rustls = "1.2.4"
zmux-quinn = { version = "1.2.4", features = ["rustls-ring"] }
zmux-websocket = "1.2.4"
zmux-http = "1.2.4"
zmux-h3 = "1.2.4"
zmux-webtransport = "1.2.4"
http = "1"
tokio-tungstenite = { version = "0.30", default-features = false }
quinn = { version = "0.11.9", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false }
webpki-roots = "1"

[profile.release]
lto = "thin"
codegen-units = 1

