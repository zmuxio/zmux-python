[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "zmuxio"
version = "0.3.1"
description = "QMux-compatible stream and datagram multiplexing over one or many byte pipes (Rust core)"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Free Threading :: 2 - Beta",
    "Programming Language :: Rust",
    "Framework :: AsyncIO",
    "Typing :: Typed",
    "Topic :: Internet",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "cryptography>=42"]

[project.urls]
Repository = "https://github.com/zmuxio/zmux-python"

[tool.maturin]
python-source = "python"
module-name = "zmux._zmux"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
