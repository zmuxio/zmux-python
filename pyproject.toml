[build-system]
requires = ["maturin>=1.16.0,<2"]
build-backend = "maturin"

[project]
name = "zmuxio"
dynamic = ["version"]
description = "QMux-compatible stream and datagram multiplexing over one or many byte pipes (Rust core)"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Free Threading :: 2 - Beta",
    "Programming Language :: Rust",
    "Framework :: AsyncIO",
    "Typing :: Typed",
    "Topic :: Internet",
]

[dependency-groups]
build = ["maturin>=1.16.0,<2"]
test = ["pytest>=9.2.0", "pytest-asyncio>=1.5.0", "hypothesis>=6.170.23"]
test-tls = ["cryptography>=50.0.2"]
lint = ["mypy>=2.4.1", "ruff==0.17.6"]

[project.urls]
Repository = "https://github.com/zmuxio/zmux-python"

[tool.maturin]
python-source = "python"
module-name = "zmux._zmux"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "RUF"]
# The formatter does not wrap comments, docstrings or string literals.
ignore = ["E501"]
