name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Rust lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: lint-${{ hashFiles('Cargo.lock') }}
          restore-keys: lint-
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings

  types:
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install "mypy>=2.4"
      - run: python -m mypy --strict python/zmux

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest ]
        # 3.12 builds the abi3 wheel; 3.14t the free-threaded one.
        python: [ '3.12', '3.14t' ]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        id: py
        with:
          python-version: ${{ matrix.python }}
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: test-${{ runner.os }}-${{ matrix.python }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: test-${{ runner.os }}-${{ matrix.python }}-
      - name: Build the wheel
        shell: bash
        run: |
          python -m pip install "maturin>=1.16,<2"
          maturin build --release --locked --out dist -i "${{ steps.py.outputs.python-path }}"
      - name: Install and test
        shell: bash
        run: |
          python -m pip install --find-links dist --no-index zmuxio
          python -m pip install "pytest>=9.2" "pytest-asyncio>=1.4.1" "cryptography>=50"
          python -m pytest -q tests
