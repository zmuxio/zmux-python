name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Rust lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: lint-${{ hashFiles('Cargo.lock') }}
          restore-keys: lint-
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings

  audit:
    name: Security advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-audit
      # Vulnerabilities fail the job; an unmaintained-crate warning does not.
      - run: cargo audit

  types:
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --group lint --group test --group test-tls
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m mypy --strict .
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: types-${{ hashFiles('Cargo.lock') }}
          restore-keys: types-
      - name: Build and install the module
        run: |
          python tools/install-build-requirements.py
          maturin build --locked --features test-hooks --out dist
          python -m pip install --find-links dist --no-index zmuxio
      - name: Stubs match the module
        run: python -m mypy.stubtest zmux --allowlist tests/stubtest-allowlist.txt

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }}${{ matrix.arch && format(', {0}', matrix.arch) || '' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest ]
        # 3.12 builds the abi3 wheel; 3.14t the free-threaded one. The abi3
        # wheel also runs on the newer CPython releases, checked on Linux.
        python: [ '3.12', '3.14t' ]
        include:
          - { os: ubuntu-latest, python: '3.13' }
          - { os: ubuntu-latest, python: '3.14' }
          # 32-bit Windows, as the release builds it; the x64 runner runs the
          # x86 interpreter, so the wheel is tested natively.
          - { os: windows-latest, python: '3.12', arch: x86, target: i686-pc-windows-msvc }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: py
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.arch || '' }}
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          if [[ -n "${{ matrix.target }}" ]]; then rustup target add "${{ matrix.target }}"; fi
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: test-${{ runner.os }}-${{ matrix.arch }}-${{ matrix.python }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: test-${{ runner.os }}-${{ matrix.arch }}-${{ matrix.python }}-
      - name: Build the wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python tools/install-build-requirements.py
          maturin build --release --locked --features test-hooks --out dist -i "${{ steps.py.outputs.python-path }}" ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
      - name: Install and test
        shell: bash
        run: |
          python -m pip install --find-links dist --no-index zmuxio
          python -m pip install --group test
          # cryptography ships no 32-bit Windows wheel; the TLS tests skip there.
          if [[ "${{ matrix.arch }}" != x86 ]]; then python -m pip install --group test-tls; fi
          python -m pytest -q -rs tests

  macos-x86_64:
    # GitHub is retiring its Intel macOS runners: the x86_64 wheel is
    # cross-built on the arm64 runner, as the release builds it. It is built
    # and checked for its platform tag, not run.
    name: Build (macOS x86_64, cross-compiled)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: py312
        with:
          python-version: '3.12'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: py314t
        with:
          python-version: '3.14t'
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target x86_64-apple-darwin
          rustup default stable
      - name: Build the wheels
        run: |
          python -m pip install --upgrade pip
          python tools/install-build-requirements.py
          maturin build --release --locked --target x86_64-apple-darwin --out dist \
            -i "${{ steps.py312.outputs.python-path }}" -i "${{ steps.py314t.outputs.python-path }}"
          wheels=(dist/*macosx*x86_64.whl)
          printf '%s\n' "${wheels[@]}"
          test "${#wheels[@]}" -eq 2
