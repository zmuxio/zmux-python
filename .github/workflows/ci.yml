name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Rust lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: lint-${{ hashFiles('Cargo.lock') }}
          restore-keys: lint-
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings

  audit:
    name: Security advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-audit
      # Vulnerabilities fail the job; an unmaintained-crate warning does not.
      - run: cargo audit

  types:
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install "mypy>=2.4"
      - run: python -m mypy --strict python/zmux
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: types-${{ hashFiles('Cargo.lock') }}
          restore-keys: types-
      - name: Build and install the module
        run: |
          python -m pip install "maturin>=1.16,<2"
          maturin build --locked --features test-hooks --out dist
          python -m pip install --find-links dist --no-index zmuxio
      - name: Stubs match the module
        run: python -m mypy.stubtest zmux --allowlist tests/stubtest-allowlist.txt

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }}${{ matrix.arch && format(', {0}', matrix.arch) || '' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest ]
        # 3.12 builds the abi3 wheel; 3.14t the free-threaded one. The abi3
        # wheel also runs on the newer CPython releases, checked on Linux.
        python: [ '3.12', '3.14t' ]
        include:
          - { os: ubuntu-latest, python: '3.13' }
          - { os: ubuntu-latest, python: '3.14' }
          # 32-bit Windows, as the release builds it; the x64 runner runs the
          # x86 interpreter, so the wheel is tested natively.
          - { os: windows-latest, python: '3.12', arch: x86, target: i686-pc-windows-msvc }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: py
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.arch || '' }}
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          if [[ -n "${{ matrix.target }}" ]]; then rustup target add "${{ matrix.target }}"; fi
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: test-${{ runner.os }}-${{ matrix.arch }}-${{ matrix.python }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: test-${{ runner.os }}-${{ matrix.arch }}-${{ matrix.python }}-
      - name: Build the wheel
        shell: bash
        run: |
          python -m pip install "maturin>=1.16,<2"
          maturin build --release --locked --features test-hooks --out dist -i "${{ steps.py.outputs.python-path }}" ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
      - name: Install and test
        shell: bash
        run: |
          python -m pip install --find-links dist --no-index zmuxio
          python -m pip install "pytest>=9.2" "pytest-asyncio>=1.5" "hypothesis>=6.170"
          # cryptography ships no 32-bit Windows wheel; the TLS tests skip there.
          if [[ "${{ matrix.arch }}" != x86 ]]; then python -m pip install "cryptography>=50.0.2"; fi
          python -m pytest -q -rs tests

  macos-x86_64:
    # GitHub is retiring its Intel macOS runners: the x86_64 wheel is
    # cross-built on the arm64 runner, as the release builds it. It is built
    # and checked for its platform tag, not run.
    name: Build (macOS x86_64, cross-compiled)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: py312
        with:
          python-version: '3.12'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: py314t
        with:
          python-version: '3.14t'
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target x86_64-apple-darwin
          rustup default stable
      - name: Build the wheels
        run: |
          python -m pip install "maturin>=1.16,<2"
          maturin build --release --locked --target x86_64-apple-darwin --out dist \
            -i "${{ steps.py312.outputs.python-path }}" -i "${{ steps.py314t.outputs.python-path }}"
          wheels=(dist/*macosx*x86_64.whl)
          printf '%s\n' "${wheels[@]}"
          test "${#wheels[@]}" -eq 2

  interop:
    name: Interop (Go zmux peers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: zmux-python
      - name: Checkout zmux-go
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zmuxio/zmux-go
          path: zmux-go
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: py
        with:
          python-version: '3.12'
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: 'stable'
          cache-dependency-path: zmux-python/interop/shape-go-peer/go.sum
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            zmux-python/target
          key: interop-${{ hashFiles('zmux-python/Cargo.lock') }}
          restore-keys: interop-
      - name: Build and install the module
        working-directory: zmux-python
        run: |
          python -m pip install "maturin>=1.16,<2"
          maturin build --release --locked --out dist -i "${{ steps.py.outputs.python-path }}"
          python -m pip install --find-links dist --no-index zmuxio
          python -m pip install "pytest>=9.2" "pytest-asyncio>=1.5" "hypothesis>=6.170" "cryptography>=50.0.2"
      - name: Build the Go peers
        run: |
          out="$GITHUB_WORKSPACE/peers"
          mkdir -p "$out"
          "$GITHUB_WORKSPACE/zmux-go/interop/webpeer/build.sh" "$out/web-go"
          # The shaping peer builds against the zmux-go checkout, through a workspace.
          printf 'go 1.27\n\nuse (\n\t%s\n\t%s\n)\n' \
            "$GITHUB_WORKSPACE/zmux-python/interop/shape-go-peer" "$GITHUB_WORKSPACE/zmux-go" > "$out/go.work"
          (cd zmux-python/interop/shape-go-peer && GOWORK="$out/go.work" timeout 300 go build -o "$out/shape-go-peer" .)
      - name: Run the interop tests
        working-directory: zmux-python
        env:
          ZMUX_GO_HTTP_PEER: ${{ github.workspace }}/peers/web-go/httppeer
          ZMUX_SHAPE_PEER: ${{ github.workspace }}/peers/shape-go-peer
          ZMUX_SHAPE_DEF: ${{ github.workspace }}/zmux-python/tests/testdata/shaping/interop.json
        run: |
          timeout 600 python -m pytest -q -rs --junitxml=interop.xml tests/test_http_tls_interop.py tests/test_shaping_interop.py
          # Every test ran: none may skip for a missing peer.
          python - <<'CHECK'
          import xml.etree.ElementTree as ET
          s = ET.parse("interop.xml").getroot().find("testsuite")
          counts = {k: int(s.attrib[k]) for k in ("tests", "failures", "errors", "skipped")}
          assert counts == {"tests": 7, "failures": 0, "errors": 0, "skipped": 0}, counts
          CHECK
