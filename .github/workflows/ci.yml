name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - 'releases/*'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: [ '3.10', '3.11', '3.12', '3.13', '3.14' ]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true

      - name: Install test dependencies
        run: python -m pip install aioquic cryptography

      - name: Run tests
        env:
          PYTHONPATH: src:packages/zmuxio-aioquic/src
        run: python -m unittest discover -s tests

  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Check release versions agree
        run: python tools/check_release_version.py

      - name: Build distributions
        run: |
          python -m pip install build
          python -m build --outdir dist .
          python -m build --outdir dist packages/zmuxio-aioquic

      - name: Install and import built wheels
        run: |
          python -m pip install dist/*.whl
          cd /tmp
          python -c "import zmux, zmux_aioquic; print(zmux.__version__)"

  interop:
    name: Interop (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout zmux-python
        uses: actions/checkout@v5
        with:
          path: zmux-python

      - name: Checkout zmux-go
        uses: actions/checkout@v5
        with:
          repository: zmuxio/zmux-go
          path: zmux-go

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: zmux-go/go.mod
          cache-dependency-path: zmux-go/adapter/quicmux/go.sum

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install test dependencies
        run: python -m pip install aioquic cryptography

      - name: Run Go interop smoke tests
        working-directory: zmux-python
        env:
          PYTHONPATH: src:packages/zmuxio-aioquic/src
          ZMUX_INTEROP: '1'
          ZMUX_GO_ROOT: ${{ github.workspace }}/zmux-go
        run: python -m unittest -v tests.test_interop_go tests.test_zmux_aioquic_go_interop
