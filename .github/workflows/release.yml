name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  # A manual run builds and checks every wheel without publishing.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      published: ${{ steps.published.outputs.published }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check the tag against the package versions
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ "${GITHUB_REF_TYPE}" != tag ]]; then
            version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          fi
          python - "${version}" <<'PY'
          import re, sys, tomllib
          version = sys.argv[1]
          with open("pyproject.toml", "rb") as f:
              project = tomllib.load(f)["project"]["version"]
          with open("Cargo.toml", "rb") as f:
              crate = tomllib.load(f)["package"]["version"]
          init = re.search(r'__version__ = "([^"]+)"', open("python/zmux/__init__.py").read()).group(1)
          found = {"pyproject.toml": project, "Cargo.toml": crate, "__init__.py": init}
          bad = {k: v for k, v in found.items() if v != version}
          if bad:
              sys.exit(f"tag v{version} does not match {bad}")
          PY
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
      - name: Check whether PyPI has the version
        id: published
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          status=0
          python3 - "${VERSION}" <<'PY' || status=$?
          import sys, urllib.error, urllib.request
          request = urllib.request.Request(
              f"https://pypi.org/pypi/zmuxio/{sys.argv[1]}/json",
              headers={"User-Agent": "zmux-python-release-workflow"},
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  sys.exit(0 if response.status == 200 else 1)
          except urllib.error.HTTPError as exc:
              sys.exit(1 if exc.code == 404 else 2)
          except Exception as exc:
              print(f"could not query PyPI: {exc}", file=sys.stderr)
              sys.exit(2)
          PY
          if [[ "${status}" -eq 0 ]]; then
            echo "published=true" >> "${GITHUB_OUTPUT}"
            echo "zmuxio ${VERSION} is already published; publish will be skipped."
          elif [[ "${status}" -eq 1 ]]; then
            echo "published=false" >> "${GITHUB_OUTPUT}"
          else
            exit "${status}"
          fi

  wheels:
    name: Wheels (${{ matrix.platform }} ${{ matrix.target }})
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        # `test`: the runner runs the wheels natively, so the tests run.
        # Cross-built wheels only build. Every target gets the abi3 wheel
        # (3.12+) and the free-threaded 3.14t one.
        # `qemu`: the Docker platform for an import test of a cross-built
        # wheel.
        include:
          - { os: ubuntu-latest, platform: manylinux, target: x86_64, manylinux: auto, test: true }
          - { os: ubuntu-24.04-arm, platform: manylinux, target: aarch64, manylinux: auto, test: true }
          - { os: ubuntu-latest, platform: manylinux, target: armv7, manylinux: auto, qemu: linux/arm/v7 }
          - { os: ubuntu-latest, platform: manylinux, target: i686, manylinux: auto, qemu: linux/386 }
          - { os: ubuntu-latest, platform: manylinux, target: ppc64le, manylinux: auto, qemu: linux/ppc64le }
          - { os: ubuntu-latest, platform: manylinux, target: s390x, manylinux: auto, qemu: linux/s390x }
          - { os: ubuntu-latest, platform: manylinux, target: riscv64gc-unknown-linux-gnu, manylinux: '2_31' }
          - { os: ubuntu-latest, platform: musllinux, target: x86_64, manylinux: musllinux_1_2, qemu: linux/amd64 }
          - { os: ubuntu-24.04-arm, platform: musllinux, target: aarch64, manylinux: musllinux_1_2, qemu: linux/arm64 }
          - { os: ubuntu-latest, platform: musllinux, target: armv7, manylinux: musllinux_1_2, qemu: linux/arm/v7 }
          - { os: ubuntu-latest, platform: musllinux, target: i686, manylinux: musllinux_1_2, qemu: linux/386 }
          - { os: macos-latest, platform: macos, target: aarch64, test: true }
          - { os: macos-15-intel, platform: macos, target: x86_64, test: true }
          - { os: windows-latest, platform: windows, target: x64, test: true }
          - { os: windows-latest, platform: windows, target: x86, arch: x86 }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        if: matrix.platform == 'macos' || matrix.platform == 'windows'
        id: py312
        with:
          python-version: '3.12'
          architecture: ${{ matrix.arch || '' }}
      - uses: actions/setup-python@v5
        if: matrix.platform == 'macos' || matrix.platform == 'windows'
        id: py314t
        with:
          python-version: '3.14t'
          architecture: ${{ matrix.arch || '' }}
      - name: Build (Linux container)
        if: matrix.platform == 'manylinux' || matrix.platform == 'musllinux'
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --out dist -i python3.12 -i python3.14t
      - name: Build
        if: matrix.platform == 'macos' || matrix.platform == 'windows'
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --locked --out dist -i ${{ steps.py312.outputs.python-path }} -i ${{ steps.py314t.outputs.python-path }}
      - uses: actions/setup-python@v5
        if: matrix.test && matrix.platform == 'manylinux'
        id: lpy312
        with:
          python-version: '3.12'
      - uses: actions/setup-python@v5
        if: matrix.test && matrix.platform == 'manylinux'
        id: lpy314t
        with:
          python-version: '3.14t'
      - name: Test the wheels
        if: matrix.test
        shell: bash
        run: |
          for py in "${{ steps.py312.outputs.python-path }}${{ steps.lpy312.outputs.python-path }}" \
                    "${{ steps.py314t.outputs.python-path }}${{ steps.lpy314t.outputs.python-path }}"; do
            rm -rf .venv-test
            "${py}" -m venv .venv-test
            if [[ -x .venv-test/bin/python ]]; then vpy=.venv-test/bin/python; else vpy=.venv-test/Scripts/python; fi
            "${vpy}" -m pip install --find-links dist --no-index --only-binary :all: zmuxio
            "${vpy}" -m pip install "pytest>=8" "pytest-asyncio>=0.24" "cryptography>=42"
            "${vpy}" -m pytest -q tests
          done
      - uses: docker/setup-qemu-action@v3
        if: matrix.qemu
      - name: Import test (QEMU)
        if: matrix.qemu
        run: |
          image=python:3.12-slim
          if [[ "${{ matrix.platform }}" == musllinux ]]; then image=python:3.12-alpine; fi
          docker run --rm --platform "${{ matrix.qemu }}" -v "$PWD/dist:/dist" "${image}" sh -c \
            "pip install --no-index --find-links /dist --only-binary :all: zmuxio && python -c 'import zmux; print(zmux.__version__)'"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform }}-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  sdist:
    name: Source distribution
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish zmuxio
    needs: [ validate, wheels, sdist ]
    if: startsWith(github.ref, 'refs/tags/v') && needs.validate.outputs.published != 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/zmuxio
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true
      - name: Check the distributions
        run: |
          python3 -m pip install twine
          python3 -m twine check --strict dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
