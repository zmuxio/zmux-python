name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate versions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Validate release tag and package versions
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          python tools/check_release_version.py "${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  test:
    name: Test (Python ${{ matrix.python }})
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true

      - name: Install test dependencies
        run: python -m pip install aioquic cryptography

      - name: Run tests
        env:
          PYTHONPATH: src:packages/zmuxio-aioquic/src
        run: python -m unittest discover -s tests

  build:
    name: Build distributions
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build
        run: |
          python -m pip install build twine
          python -m build --outdir dist/zmuxio .
          python -m build --outdir dist/zmuxio-aioquic packages/zmuxio-aioquic
          python -m twine check --strict dist/zmuxio/* dist/zmuxio-aioquic/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-core:
    name: Publish zmuxio
    needs: [validate, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/zmuxio
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/zmuxio/
          skip-existing: true

  publish-aioquic:
    name: Publish zmuxio-aioquic
    needs: [validate, publish-core]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/zmuxio-aioquic
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Wait for zmuxio indexing
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          for attempt in $(seq 1 60); do
            if python -m pip download --quiet --no-deps --no-cache-dir --dest /tmp/zmuxio-index \
                --index-url https://pypi.org/simple "zmuxio==${VERSION}"; then
              echo "zmuxio ${VERSION} is installable from PyPI"
              exit 0
            fi
            echo "waiting for zmuxio ${VERSION} on PyPI (attempt ${attempt})"
            sleep 10
          done
          echo "zmuxio ${VERSION} did not appear on PyPI in time" >&2
          exit 1

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/zmuxio-aioquic/
          skip-existing: true
