name: Scheduled checks

# Weekly probe of what the locked CI cannot see: the newest stable Rust, the
# newest compatible dependencies, the newest Python and tools, and the
# advisory database. A failure opens (or updates) one issue; a pass closes it.
on:
  workflow_dispatch:
  schedule:
    - cron: '41 4 * * 1'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  latest:
    name: Latest toolchain and dependencies (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: [ '3.12', '3.x', '3.14t' ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: py
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Install the newest stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
      # Throwaway: the lockfile and the pins are not committed back.
      - name: Update to the newest compatible dependencies
        run: |
          cargo update
          python -m pip install -U pip maturin pytest pytest-asyncio hypothesis cryptography mypy
      - run: cargo clippy --all-targets -- -D warnings
      - name: Build and install the module
        run: |
          maturin build --release --features test-hooks --out dist -i "${{ steps.py.outputs.python-path }}"
          python -m pip install --find-links dist --no-index zmuxio
      - run: python -m pytest -q -rs tests
      - run: python -m mypy --strict python/zmux
      - run: python -m mypy.stubtest zmux --allowlist tests/stubtest-allowlist.txt

  audit:
    name: Security advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-audit
      # No ignore list: a fix that was published since the last release shows.
      - run: cargo audit
      - name: The newest compatible dependencies
        run: |
          cargo update
          cargo audit

  report:
    name: Report
    needs: [ latest, audit ]
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TITLE: Scheduled checks are failing
    steps:
      - name: Open, update or close the issue
        run: |
          number=$(gh issue list --state open --search "${TITLE} in:title" --json number,title \
            --jq "map(select(.title == \"${TITLE}\"))[0].number // empty")
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [[ "${{ contains(needs.*.result, 'failure') }}" == true ]]; then
            body="The scheduled run failed: ${run_url}"
            if [[ -n "${number}" ]]; then
              gh issue comment "${number}" --body "${body}"
            else
              gh issue create --title "${TITLE}" --body "${body}"
            fi
          elif [[ -n "${number}" && "${{ contains(needs.*.result, 'cancelled') }}" != true ]]; then
            gh issue close "${number}" --comment "The scheduled run passed: ${run_url}"
          fi
